# TODO set user/group IDs

version: "3"

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/apple/gitea/data

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1002
      - USER_GID=1002
    restart: always
    networks:
      - gitea
    volumes:
      - data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # ports:
    #   - "3000:3000"
    #   - "222:22"
