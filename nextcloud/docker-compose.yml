# TODO set volume directories

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/apple/nextcloud/data

services:
  nextcloud:
    image: nextcloud:27.1.3
    container_name: nextcloud
    hostname: nextcloud
    deploy:
      resources:
        reservations:
          memory: 512M
    network_mode: bridge
    # ports:
    #   - 10081:80/tcp
    #   - 10443:443/tcp
    restart: unless-stopped
    volumes:
      - data:/var/www/html
